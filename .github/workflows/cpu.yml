name: cpu
on:
  workflow_dispatch:
    inputs:
      mask:
        description: "validation mask"
        default: "class2"
        type: choice
        options: [class2, class3, cross]
      n:
        description: "queries"
        default: "200"
permissions:
  contents: write
  actions: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: mkdir -p data results
      - name: download competition data
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          python -c "import os; open(os.path.expanduser('~/.kaggle.json'),'w').write('{\"username\":\"'$KAGGLE_USERNAME'\",\"key\":\"'$KAGGLE_KEY'\"}')"
          chmod 600 ~/.kaggle.json
          kaggle competitions download -c enveda-CASMI26-molecule-id-mass-spectra -p data
          ls -la data/
      - run: python -m pytest -q tests/
        env:
          PYTHONPATH: src
      - name: run mask
        run: PYTHONPATH=src python -m mscpu.run --data data/train.parquet --mask "${{ inputs.mask }}" --n "${{ inputs.n }}" --out results/${{ inputs.mask }}.json
      - name: scramble + commit
        env:
          SCRAMBLE_KEY: ${{ secrets.SCRAMBLE_KEY }}
        run: |
          node scripts/scramble.mjs encrypt results/${{ inputs.mask }}.json
          git config user.name "mscpu"
          git config user.email "mscpu@users.noreply.github.com"
          git add results/${{ inputs.mask }}.json
          git diff --cached --quiet || git commit -m "cpu ${{ inputs.mask }} $(date -u +%F)"
          git push
