name: cpu
on:
  workflow_dispatch:
    inputs:
      mask:
        description: "validation mask"
        default: "class2"
        type: choice
        options: [class2, class3, cross]
      n:
        description: "queries"
        default: "200"
      task:
        description: "validate, predict, or gates (checks-only: build+test, no data, no run)"
        default: "validate"
        type: choice
        options: [validate, predict, gates]
      shard:
        description: "shard index"
        default: "0"
      shards:
        description: "shard count"
        default: "1"
      jobs:
        description: "local worker processes"
        default: "4"
      suffix:
        description: "output filename suffix, e.g. -furnace (probes must use one)"
        default: ""
      wl:
        description: "genome z weight lib"
        default: "1.0"
      wa:
        description: "genome z weight analog"
        default: "1.0"
      wf:
        description: "genome z weight frag"
        default: "1.0"
      rl:
        description: "genome rrf weight lib"
        default: "1.0"
      ra:
        description: "genome rrf weight analog"
        default: "1.0"
      rf:
        description: "genome rrf weight frag"
        default: "1.0"
      casc-z:
        description: "genome cascade gate"
        default: "3.0"
      rout-lib:
        description: "genome router gate lib"
        default: "0.5"
      rout-bin:
        description: "genome router gate bin"
        default: "0.4"
      rout-binw:
        description: "genome router gate binw"
        default: "0.4"
permissions:
  contents: write
  actions: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: mkdir -p data results
      - name: build rust engine
        run: |
          cd rust-bitvec && cargo build --release && cargo test --release
          cd ../rust-chem && cargo build --release && cargo test --release
      - name: restore data cache
        if: ${{ inputs.task != 'gates' }}
        id: datacache
        uses: actions/cache@v4
        with:
          path: data
          key: casmi26-data-v1
      - name: download competition data
        if: ${{ inputs.task != 'gates' && steps.datacache.outputs.cache-hit != 'true' }}
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          pip install -q kaggle
          python -c "import os,json; open(os.path.expanduser('~/.kaggle.json'),'w').write(json.dumps({'username':os.environ['KAGGLE_USERNAME'],'key':os.environ['KAGGLE_KEY']}))"
          chmod 600 ~/.kaggle.json
          kaggle competitions download -c enveda-CASMI26-molecule-id-mass-spectra -p data
          unzip -o data/*.zip -d data
          ls -la data/
      - run: pip install -q pytest zstandard && python -m pytest -q tests/
        env:
          PYTHONPATH: src
      - name: run mask
        if: ${{ inputs.task == 'validate' }}
        run: PYTHONPATH=src python -m mscpu.run --data data/train.parquet --mask "${{ inputs.mask }}" --n "${{ inputs.n }}" --rust-bin rust-bitvec/target/release/binvec --shard "${{ inputs.shard }}" --shards "${{ inputs.shards }}" --jobs "${{ inputs.jobs }}" --out-suffix="${{ inputs.suffix }}" --wl "${{ inputs.wl }}" --wa "${{ inputs.wa }}" --wf "${{ inputs.wf }}" --rl "${{ inputs.rl }}" --ra "${{ inputs.ra }}" --rf "${{ inputs.rf }}" --casc-z "${{ inputs.casc-z }}" --rout-lib "${{ inputs.rout-lib }}" --rout-bin "${{ inputs.rout-bin }}" --rout-binw "${{ inputs.rout-binw }}" --out results/${{ inputs.mask }}-${{ inputs.shard }}.json
      - name: smart probe (GREEN / RED / INFRA — never ships blind, never cries code-bug on host death)
        if: ${{ always() && inputs.task == 'validate' }}
        env:
          MASK: ${{ inputs.mask }}
          SHARD: ${{ inputs.shard }}
          SUFFIX: ${{ inputs.suffix }}
          NREQ: ${{ inputs.n }}
          WL: ${{ inputs.wl }}
          WA: ${{ inputs.wa }}
          WF: ${{ inputs.wf }}
          RL: ${{ inputs.rl }}
          RA: ${{ inputs.ra }}
          RF: ${{ inputs.rf }}
          CASCZ: ${{ inputs.casc-z }}
          ROUTLIB: ${{ inputs.rout-lib }}
        run: |
          python - <<'PY'
          import json, os, sys, glob
          mask = os.environ["MASK"]; shard = os.environ["SHARD"]; suffix = os.environ.get("SUFFIX","")
          nreq = int(os.environ.get("NREQ","0") or 0)
          path = f"results/{mask}-{shard}{suffix}.json"
          status_path = path + ".status"
          verdict_path = f"results/verdict-{mask}-{shard}{suffix}.txt"
          def emit(verdict, lines):
              msg = f"SMART-PROBE {verdict}: " + "; ".join(lines)
              print(msg, flush=True)
              try:
                  with open(verdict_path, "w") as vf:
                      vf.write(verdict + "\n" + "\n".join(lines) + "\n")
              except Exception as e:
                  print(f"(verdict file unwritable: {e})", flush=True)
              # INFRA exits 3 so the step table tells host-death apart from code-RED (exit 1).
              sys.exit({"GREEN": 0, "RED": 1, "INFRA": 3}[verdict])
          # M199: exact dispatched path only — the glob fallback once graded a
          # STALE committed probe file (engineswap) as this run's output.
          fp = path if os.path.exists(path) else None
          status_txt = None
          try:
              if os.path.exists(status_path):
                  with open(status_path) as sf:
                      status_txt = sf.read()
          except Exception:
              status_txt = None
          if fp is None:
              started = bool(status_txt and "STARTED" in status_txt)
              pre = bool(status_txt and "PRECOMPUTE-DONE" in status_txt)
              sigterm = bool(status_txt and "SIGTERM" in status_txt)
              emit("INFRA", [f"no output file (looked for {path})",
                             f"sidecar started={started} precompute={pre} sigterm={sigterm}",
                             "host died before JSON existed — retry with backoff, do NOT revert code"])
          print(f"SMART-PROBE checking {fp} (+ {status_path})");
          red = []
          def need(cond, msg):
              if not cond: red.append(msg)
          try:
              out = json.load(open(fp))
          except Exception as e:
              # M202: DONE-line match — "DONE" is a substring of "PRECOMPUTE-DONE",
              # so a plain `in` check always sees DONE and mislabels mid-write kills.
              _done = bool(status_txt) and any(l.startswith("DONE") for l in status_txt.splitlines())
              if status_txt and not _done:
                  emit("INFRA", [f"unreadable JSON {fp}: {e}", "run never reached DONE — host died mid-write, retry"])
              emit("RED", [f"unreadable JSON {fp}: {e}"])
          # 1. engine + shape: the probe ran the Rust engine on real queries
          need(out.get("engine") == "rust", f"engine != rust ({out.get('engine')!r}) — wrong binary path or fallback")
          n = out.get("n", 0)
          need(isinstance(n, int) and n >= min(10, nreq), f"n too small ({n} < min(10,{nreq})) — queries never ran")
          rrs = out.get("rrs", {})
          need(set(rrs.keys()) == {"z","lib","analog","frag","rrf","cascade","bin","rrfb","binw","router","stein","mass","zw","rrfw","pure"},
               f"variants incomplete ({sorted(rrs.keys())}) — a channel never returned")
          for v, arr in rrs.items():
              need(len(arr) == n, f"rrs[{v}] len {len(arr)} != n {n}")
          # 2. score fields present + sane (catches silent NaN/zero collapse)
          mkeys = ["mrr","mrr_lib","mrr_analog","mrr_frag","mrr_rrf","mrr_cascade","mrr_bin","mrr_rrfb","mrr_binw","mrr_router","mrr_stein","mrr_mass","mrr_zw","mrr_rrfw","mrr_pure"]
          for k in mkeys:
              v = out.get(k)
              need(isinstance(v,(int,float)) and v==v and 0.0 <= v <= 1.0, f"{k} insane ({v!r})")
          need(out.get("fusion") is not None, "fusion params missing — genome not recorded")
          need("mass_swap_rate" in out, "mass_swap_rate missing — mass channel signal discarded (old bug)")
          need(isinstance(out.get("mass_swap_rate"),(int,float)), "mass_swap_rate insane")
          # M199: defensive — the probe must end in a verdict, never a traceback.
          pools = out.get("pools") or []
          need(len(pools) == n and (sum(pools)/max(1,n)) > 0, "pools empty — candidate pool never built")
          # 3. lane sanity, mask-conditional (catches blindness/pool breaks the old probes walked past)
          if mask == "class2":
              need(out.get("mrr_lib",0) > 0.5, f"class2 mrr_lib {out.get('mrr_lib')} <= 0.5 — easy-lane retrieval broken")
              need(out.get("mrr_analog",0) > 0.1, f"class2 mrr_analog {out.get('mrr_analog')} <= 0.1 — analog pool broken")
          elif mask == "class3":
              need(out.get("mrr_analog",0) > 0.1, f"class3 mrr_analog {out.get('mrr_analog')} <= 0.1 — novel-lane retrieval broken")
              need(out.get("mrr_lib",1) < 0.2, f"class3 mrr_lib {out.get('mrr_lib')} >= 0.2 — blindness violated (leak?)")
          # 4. genome actually applied (the thing -genomeA/L were sent to check and never did)
          try:
              wl,wa,wf,rl,ra,rf = float(os.environ["WL"]),float(os.environ["WA"]),float(os.environ["WF"]),float(os.environ["RL"]),float(os.environ["RA"]),float(os.environ["RF"])
              cz, rlib = float(os.environ["CASCZ"]), float(os.environ["ROUTLIB"])
          except Exception:
              wl=wa=wf=rl=ra=rf=1.0; cz=3.0; rlib=0.5
          f = out.get("fusion",{})
          for k, want in [("wl",wl),("wa",wa),("wf",wf),("rl",rl),("ra",ra),("rf",rf),("casc_z",cz),("rout_lib",rlib)]:
              need(abs(float(f.get(k, float("nan"))) - want) < 1e-9, f"fusion.{k} {f.get(k)!r} != dispatched {want} — genome never reached engine")
          neutral = (wl==1.0 and wa==1.0 and wf==1.0 and rl==1.0 and ra==1.0 and rf==1.0 and cz==3.0)
          if neutral:
              need(abs(out["mrr_zw"]-out["mrr"]) < 1e-9, f"neutral genome moved zw ({out['mrr_zw']} vs z {out['mrr']}) — bit-identity broken")
              need(abs(out["mrr_rrfw"]-out["mrr_rrf"]) < 1e-9, f"neutral genome moved rrfw ({out['mrr_rrfw']} vs rrf {out['mrr_rrf']})")
          else:
              moved = (rrs.get("zw") != rrs.get("z")) or (rrs.get("rrfw") != rrs.get("rrf"))
              need(moved, "non-neutral genome left zw==z AND rrfw==rrf — genome ignored, probe measured nothing")
          if red:
              emit("RED", red)
          emit("GREEN", [f"{fp} engine={out.get('engine')} n={n} mrr={out.get('mrr'):.4f} lib={out.get('mrr_lib'):.4f} analog={out.get('mrr_analog'):.4f} stein={out.get('mrr_stein'):.4f} mass={out.get('mrr_mass'):.4f} zw={out.get('mrr_zw'):.4f} swap={out.get('mass_swap_rate'):.3f} pure={out.get('mrr_pure'):.4f}"])
          PY
      - name: run predict
        if: ${{ inputs.task == 'predict' }}
        run: PYTHONPATH=src python -m mscpu.predict --train data/train.parquet --test data/test.parquet --out results/predict.json
      - name: scramble + commit
        if: ${{ inputs.task != 'gates' }}
        env:
          SCRAMBLE_KEY: ${{ secrets.SCRAMBLE_KEY }}
        run: |
          node scripts/scramble.mjs encrypt results/*.json
          git config user.name "mscpu"
          git config user.email "mscpu@users.noreply.github.com"
          git add results/
          git diff --cached --quiet || git commit -m "cpu-r3 ${{ inputs.task }}-${{ inputs.mask }} $(date -u +%F)"
          git pull --rebase origin main
          git push
